<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Двигун">
<title>Звук двигуна</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;--fg:#111;--mut:#6b6b70;--card:#f2f2f4;--go:#1f9d55;--stop:#d64545;--hot:#e8b100}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111214;--fg:#f4f4f5;--mut:#9a9aa0;--card:#1e1f22}}
:root[data-theme="dark"]{--bg:#111214;--fg:#f4f4f5;--mut:#9a9aa0;--card:#1e1f22}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:-apple-system,system-ui,Helvetica,Arial,sans-serif;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:18px;max-width:480px;margin:0 auto;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.top{display:flex;justify-content:space-between;align-items:flex-end;text-align:center}
.rpm{font-size:48px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.spd{font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.gear{font-size:84px;font-weight:800;line-height:.9;color:var(--hot)}
.unit{color:var(--mut);font-size:13px}
.bar{height:14px;background:var(--card);border-radius:7px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--go) 0,var(--go) 60%,var(--hot) 80%,var(--stop) 100%)}
button{font:600 16px inherit;font-family:inherit;border:0;border-radius:14px;padding:14px;color:#fff;background:var(--go);width:100%}
button.on{background:var(--stop)}
button.sm{background:var(--card);color:var(--fg)}
button.sel{background:var(--hot);color:#111}
.row{display:flex;gap:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{background:var(--card);border-radius:14px;padding:12px}
input[type=range]{width:100%;height:44px;margin:4px 0 0}
label.t{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:15px}
</style>
</head>
<body>
<div class="grid" id="cars"></div>
<div class="top">
  <div><div class="rpm" id="rpm">900</div><div class="unit">об/хв</div></div>
  <div><div class="gear" id="gear">1</div><div class="unit">передача</div></div>
  <div><div class="spd" id="spd">0</div><div class="unit">км/год</div></div>
</div>
<div class="bar"><i id="bar"></i></div>
<button id="btn">Запустити двигун</button>
<div class="card">
  <strong>Газ: <span id="pct">0</span>%</strong>
  <input type="range" id="thr" min="0" max="1000" value="0" disabled>
</div>
<div class="row">
  <button class="sm" id="dn">− Вниз</button>
  <button class="sm" id="up">Вгору +</button>
  <button class="sm" id="brake">Гальмо</button>
</div>
<label class="t"><span>Автоматична коробка</span><input type="checkbox" id="auto" checked></label>
<label class="t"><span>Газ у 0 після відпускання</span><input type="checkbox" id="spring" checked></label>
<p class="unit" style="margin:0;text-align:center">Кнопки «наступний/попередній трек» на кермі перемикають машину (коли двигун запущено).</p>

<script>
const CARS=[
 {n:'Формула 1',e:'🏁',idle:3500,max:12500,pw:0.36,cd:.00006,RB:[121,77,53,40,33,27.4,24.3],
  W:[.6,.9,1,.5,.5,.7,.3,.35,.4,.2,.2,.25],noise:.06,lp:.1,lg:.45,drive:3,vol:.6,pops:0,whistle:0,bo:0,ld:0},
 {n:'Драг',e:'🚀',idle:1800,max:9000,pw:0.5,cd:.00006,RB:[110,50,26],
  W:[.5,.7,.5,1,.3,.6,.2,.75,.2,.35,.15,.5],noise:.09,lp:.06,lg:.6,drive:3.2,vol:.62,pops:.08,whistle:0,bo:0,ld:.4},
 {n:'Стрітрейсинг',e:'🔥',idle:900,max:7000,pw:0.24,cd:.00006,RB:[121,77,53,40,33,27.4,24.3],
  W:[.35,1,.25,.7,.15,.45,.1,.3,.08,.2],noise:.03,lp:.07,lg:.55,drive:2.5,vol:.6,pops:.06,whistle:.05,bo:1,ld:0},
 {n:'Джип 7.0 V8',e:'🛻',idle:650,max:5500,pw:0.32,cd:.00012,RB:[130,80,52,36,26],
  W:[.3,.5,.3,1,.2,.55,.3,.8,.15,.4,.3,.6,.1,.3,.15,.35],noise:.05,lp:.05,lg:.4,drive:2.8,vol:.62,pops:.03,whistle:0,bo:0,ld:.25}
];
let ctx=null,node=null,sil=null,running=false,throttle=0,braking=false,ui=null,prevTh=0;
let phase=0,rpm=900,lp=0,st=0,v=0,g=0,shiftT=0,shiftUp=true,duck=1,pop=0,pn=0,wp=0,bo=0;
let ci=2,c,IDLE,MAX,R,RB,NG;
const $=id=>document.getElementById(id);

function setMedia(){
  if(!('mediaSession' in navigator)) return;
  try{navigator.mediaSession.metadata=new MediaMetadata({title:c.n,artist:'Двигун',album:'Симулятор'});}catch(e){}
}
function setCar(i){
  ci=i; c=CARS[i]; IDLE=c.idle; MAX=c.max; RB=c.RB; NG=RB.length; R=RB.map(x=>x*MAX/8500);
  if(!c.sc) c.sc=0.9/c.W.reduce((a,b)=>a+b,0);
  v=0; g=0; shiftT=0; rpm=IDLE; pop=0; bo=0; duck=1;
  document.querySelectorAll('#cars button').forEach((b,j)=>b.classList.toggle('sel',j===i));
  $('rpm').textContent=IDLE; $('spd').textContent=0; $('gear').textContent=1; $('bar').style.width='0';
  setMedia();
}
function shift(d){
  if(shiftT>0) return;
  const ng=g+d;
  if(ng<0||ng>NG-1) return;
  if(d<0&&v*R[ng]>MAX+150) return;
  g=ng; shiftT=d>0?0.14:0.18; shiftUp=d>0; if(d<0) pop=0.9;
}
// тиха доріжка: iOS тоді вважає сторінку програвачем і віддає їй кнопки керма
function silentAudio(){
  const N=8000, b=new Uint8Array(44+N), dv=new DataView(b.buffer);
  const S=(o,t)=>{for(let i=0;i<t.length;i++)b[o+i]=t.charCodeAt(i);};
  S(0,'RIFF');dv.setUint32(4,36+N,true);S(8,'WAVEfmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,1,true);
  dv.setUint32(24,8000,true);dv.setUint32(28,8000,true);dv.setUint16(32,1,true);dv.setUint16(34,8,true);S(36,'data');dv.setUint32(40,N,true);
  b.fill(128,44);
  let s='';for(let i=0;i<b.length;i++)s+=String.fromCharCode(b[i]);
  const a=new Audio('data:audio/wav;base64,'+btoa(s)); a.loop=true; return a;
}
function initMedia(){
  try{
    sil=silentAudio(); sil.play().catch(()=>{});
    if(!('mediaSession' in navigator)) return;
    const h=(n,f)=>{try{navigator.mediaSession.setActionHandler(n,f);}catch(e){}};
    h('nexttrack',()=>setCar((ci+1)%CARS.length));
    h('previoustrack',()=>setCar((ci+CARS.length-1)%CARS.length));
    h('seekforward',()=>shift(1)); h('seekbackward',()=>shift(-1));
    h('play',()=>sil&&sil.play()); h('pause',()=>sil&&sil.play());
    navigator.mediaSession.playbackState='playing'; setMedia();
  }catch(e){}
}

function start(){
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  const sr=ctx.sampleRate, kst=1/(0.04*sr), kd=1/(0.01*sr), TP=2*Math.PI;
  node=ctx.createScriptProcessor(1024,1,1);
  node.onaudioprocess=e=>{
    const out=e.outputBuffer.getChannelData(0), n=out.length, dt=n/sr, th=throttle, W=c.W;
    if(shiftT>0){ shiftT-=dt; if(shiftT<=0){ shiftT=0; if(shiftUp) pop=1; } }
    if($('auto').checked&&shiftT===0){
      if(rpm>MAX-500&&th>0.2&&g<NG-1) shift(1);
      else if(rpm<MAX*0.3&&g>0&&v>5) shift(-1);
      else if(th>0.9&&g>0&&rpm<MAX*0.5&&v*R[g-1]<MAX-700) shift(-1);
    }
    let accel=0;
    if(shiftT===0&&rpm<MAX){
      const tq=Math.max(0.3,1-0.25*Math.abs(rpm-MAX*0.75)/(MAX*0.75));
      accel=th*c.pw*RB[g]*tq;
    }
    const decel=c.cd*v*v+(v>0?1.2+(th<0.05?2.5*rpm/MAX:0):0)+(braking?30:0);
    v=Math.max(0,Math.min(350,v+(accel-decel)*dt));
    const wheel=v*R[g];
    let target,tau;
    if(shiftT>0){target=Math.max(IDLE,wheel);tau=0.06;}
    else if(g===0&&v<40){
      target=Math.max(IDLE+th*MAX*0.2,wheel+th*MAX*0.35*(1-v/40));
      tau=target>rpm?0.06:0.15;
    }
    else{target=Math.max(IDLE,wheel);tau=0.03;}
    target=Math.min(target,MAX+100);
    const k=1/(tau*sr), dTarget=shiftT>0?0.25:1;
    if(th<0.05&&rpm>MAX*0.43&&shiftT===0&&Math.random()<c.pops) pop=Math.max(pop,0.6+Math.random()*0.4);
    if(c.bo&&prevTh>0.5&&th<0.15&&rpm>MAX*0.4) bo=1;
    prevTh=th;
    for(let i=0;i<n;i++){
      st+=(th-st)*kst;
      rpm+=(target-rpm)*k;
      duck+=(dTarget-duck)*kd;
      phase+=rpm/60/sr; if(phase>=1) phase-=1;
      const p=phase*TP; let s=0;
      for(let h=0;h<W.length;h++) s+=W[h]*Math.sin((h+1)*p);
      s*=c.sc*(1+c.ld*(Math.sin(Math.PI*phase)-0.64));
      s+=(Math.random()*2-1)*(c.noise+0.12*st);
      const open=Math.max(st,0.95*Math.max(0,(rpm-IDLE)/(MAX-IDLE)));
      lp+=(c.lp+c.lg*open)*(s-lp);
      const x=lp+(s-lp)*0.35*(0.4+0.6*open);
      const nz=Math.random()*2-1; pn+=0.15*(nz-pn);
      wp+=(2500+rpm*1.2)/sr; if(wp>1) wp-=1;
      let y=Math.tanh(x*c.drive*(0.5+0.5*open))*c.vol*duck;
      y+=pop*(pn*4+nz*0.5)+bo*(nz-pn)*0.7+Math.sin(wp*TP)*c.whistle*st*rpm/MAX;
      out[i]=Math.max(-1,Math.min(1,y));
      pop*=0.9990; bo*=0.9997;
    }
  };
  node.connect(ctx.destination);
  ctx.resume();
  initMedia();
  ui=setInterval(()=>{
    $('rpm').textContent=Math.round(rpm);
    $('spd').textContent=Math.round(v);
    $('gear').textContent=g+1;
    $('bar').style.width=Math.min(100,rpm/MAX*100)+'%';
  },50);
  running=true; $('thr').disabled=false;
  $('btn').textContent='Вимкнути двигун'; $('btn').classList.add('on');
}
function stop(){
  clearInterval(ui);
  try{node.disconnect();ctx.close();}catch(e){}
  try{sil.pause();}catch(e){}
  running=false; throttle=0; st=0; bo=0;
  $('thr').value=0; $('thr').disabled=true; $('pct').textContent=0;
  setCar(ci);
  $('btn').textContent='Запустити двигун'; $('btn').classList.remove('on');
}
CARS.forEach((car,i)=>{
  const b=document.createElement('button'); b.className='sm'; b.textContent=car.e+' '+car.n;
  b.addEventListener('click',()=>setCar(i)); $('cars').appendChild(b);
});
setCar(ci);
$('btn').addEventListener('click',()=>running?stop():start());
$('up').addEventListener('click',()=>running&&shift(1));
$('dn').addEventListener('click',()=>running&&shift(-1));
$('thr').addEventListener('input',e=>{throttle=e.target.value/1000;$('pct').textContent=Math.round(throttle*100)});
const release=()=>{if($('spring').checked){$('thr').value=0;throttle=0;$('pct').textContent=0;}};
['pointerup','touchend','change'].forEach(ev=>$('thr').addEventListener(ev,release));
const bk=$('brake');
bk.addEventListener('pointerdown',()=>braking=true);
['pointerup','pointerleave','pointercancel'].forEach(ev=>bk.addEventListener(ev,()=>braking=false));
</script>
</body>
</html>
